# Exemplo de Secret — NÃO commitar senhas reais.
# Crie no OpenShift ou configure as mesmas chaves no Serverless (S2I) como variáveis de ambiente.
#
#   oc apply -f openshift/secret.example.yaml
#   # ou
#   oc create secret generic canal-digital-db --from-env-file=openshift/env.example -n canal-digital-old

apiVersion: v1
kind: Secret
metadata:
  name: canal-digital-db
  namespace: canal-digital-old
  labels:
    app.kubernetes.io/part-of: canal-digital-quarkus-git-app
type: Opaque
stringData:
  DB_HOST: "SUBSTITUA_PELO_NOME_DO_SERVICE"
  DB_PORT: "1433"
  DB_NAME: "canal_digital"
  DB_USERNAME: "sa"
  DB_PASSWORD: "SUBSTITUA_PELA_SENHA"
  DB_ENCRYPT: "true"
  DB_TRUST_CERT: "true"
  DB_LOG_SQL: "false"
  CANAL_DEMO_SEED_ENABLED: "true"
  CANAL_DB_BOOTSTRAP: "true"
  # Opcional — se definida, sobrescreve a URL montada a partir de DB_HOST/PORT/NAME:
  # QUARKUS_DATASOURCE_JDBC_URL: "jdbc:sqlserver://SUBSTITUA:1433;databaseName=canal_digital;encrypt=true;trustServerCertificate=true"
