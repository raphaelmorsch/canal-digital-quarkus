# Knative Service — namespace canal-digital-old
# Variáveis vêm do Secret canal-digital-db (crie com secret.example.yaml ou env.example).
# No S2I + Serverless, configure as mesmas chaves na aba Environment do Service.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: canal-digital-quarkus-git
  namespace: canal-digital-old
  labels:
    app.kubernetes.io/part-of: canal-digital-quarkus-git-app
  annotations:
    image.openshift.io/triggers: |
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "canal-digital-quarkus-git:latest"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name==\"canal-digital-quarkus-git\")].image"
        }
      ]
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 0
      timeoutSeconds: 300
      containers:
        - name: canal-digital-quarkus-git
          image: image-registry.openshift-image-registry.svc:5000/canal-digital-old/canal-digital-quarkus-git:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_PROFILE
              value: prod
          envFrom:
            - secretRef:
                name: canal-digital-db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
  traffic:
    - percent: 100
      latestRevision: true
