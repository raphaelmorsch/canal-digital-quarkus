quarkus.application.name=Canal Digital Energia

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# OpenAPI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs

# Seed demo — desligue em produção real: CANAL_DEMO_SEED_ENABLED=false
canal.demo.seed.enabled=${CANAL_DEMO_SEED_ENABLED:true}
quarkus.test.profile=test
quarkus.package.main-class=br.com.energia.canal.Main

# ── SQL Server — todas as conexões via variáveis de ambiente ─────────────────
# Quarkus também aceita (prioridade maior):
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=mssql
quarkus.hibernate-orm.sql-load-script=no-file

# dev — defaults locais; sobrescreva com export DB_* ou .env
%dev.quarkus.datasource.username=${DB_USERNAME:sa}
%dev.quarkus.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}
%dev.quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:canal_digital};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:true}
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=${DB_LOG_SQL:true}

# prod — OpenShift / S2I / Serverless (todas obrigatórias, sem defaults)
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:true};loginTimeout=30;socketTimeout=30
%prod.quarkus.datasource.jdbc.acquisition-timeout=PT60S
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=${DB_LOG_SQL:false}
%prod.quarkus.datasource.health.enabled=true

# test — Dev Services (Docker)
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.db-name=${DB_NAME:canal_digital}
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false
