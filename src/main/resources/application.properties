quarkus.application.name=Canal Digital Energia

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# OpenAPI
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs

# Dados demo via DemoDataLoader (somente se tabelas vazias)
canal.demo.seed.enabled=true

# Testes de integração (@QuarkusIntegrationTest) usam o perfil test
quarkus.test.profile=test

# ── SQL Server ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mssql
quarkus.hibernate-orm.sql-load-script=no-file

# dev e prod: conexão explícita via variáveis de ambiente
%dev.quarkus.datasource.username=${DB_USERNAME:sa}
%dev.quarkus.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:canal_digital};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:true}}
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERT:true}}
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.datasource.health.enabled=true
