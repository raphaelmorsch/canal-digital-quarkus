# Perfil de testes — SQL Server via Dev Services (Docker) ou variáveis DB_* apontando para instância real
quarkus.datasource.db-kind=mssql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.db-name=canal_digital
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
canal.demo.seed.enabled=true

# Para usar SQL Server externo nos testes em vez do Dev Services, descomente:
# quarkus.datasource.devservices.enabled=false
# quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:canal_digital};encrypt=true;trustServerCertificate=true
# quarkus.datasource.username=${DB_USERNAME:sa}
# quarkus.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}
